{% extends 'portfolio/base.html' %}

{% block content %}

<div class="slider-container">
    <div class="swiper mySwiper">
        <div class="swiper-wrapper">
            {% for slide in sliders %}
            <div class="swiper-slide">
                <img src="{{ slide.image.url }}" alt="{{ slide.title }}">
                <div class="slide-content">
                    <h1>{{ slide.title }}</h1>
                    <p>{{ slide.subtitle }}</p>
                    <a href="{% url 'portfolio' %}" class="btn-gold">Projeleri İncele</a>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-pagination"></div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    var swiper = new Swiper(".mySwiper", {
        loop: true,
        autoplay: { delay: 5000, disableOnInteraction: false },
        pagination: { el: ".swiper-pagination", clickable: true },
        navigation: { nextEl: ".swiper-button-next", prevEl: ".swiper-button-prev" },
        effect: "fade",
    });
</script>

<style>
    /* Slider CSS'leri aynen kalacak... */
    .slider-container { width: 100%; height: 85vh; position: relative; }
    .swiper { width: 100%; height: 100%; }
    .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
    .swiper-slide::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); }
    .slide-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; color: #fff; width: 80%; }
    /* ...diğer stil kodları... */
</style>

{% endblock %}
