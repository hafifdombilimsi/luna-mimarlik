{% extends 'portfolio/base.html' %}

{% block content %}
<div class="container" style="padding: 5rem 0;">
    <div class="about-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;">
        
        <div class="about-img" data-aos="fade-right">
            {% if site_info.about_image %}
                <img src="{{ site_info.about_image.url }}" alt="Hakkımızda" style="width: 100%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            {% else %}
                <div style="width:100%; height:400px; background:#eee; display:flex; align-items:center; justify-content:center;">Resim Yok</div>
            {% endif %}
        </div>

        <div class="about-text" data-aos="fade-left">
            <h1 style="margin-bottom: 1.5rem;">{{ site_info.about_title }}</h1>
            <div style="font-size: 1.1rem; line-height: 1.8; color: #555;">
                {{ site_info.about_description|linebreaks }}
            </div>
        </div>
        
    </div>
</div>

<style>
    @media (max-width: 768px) {
        .about-grid { grid-template-columns: 1fr !important; gap: 2rem !important; }
    }
</style>
{% endblock %}
